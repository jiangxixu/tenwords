name: Generate daily 10 words

on:
  schedule:
    # GitHub Actions uses UTC. 00:00 UTC = 08:00 China Standard Time.
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate today's vocabulary pack
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/generate-daily.mjs
      - name: Commit generated pack
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "tenwords-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/words.json
          git commit -m "Add daily vocabulary $(TZ=Asia/Shanghai date +%F)"
          git push
