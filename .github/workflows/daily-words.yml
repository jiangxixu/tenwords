name: Generate daily vocabulary

on:
  schedule:
    # 03:00 Asia/Shanghai (UTC+8); GitHub schedules may be delayed.
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-vocabulary
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate words with DeepSeek
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/generate-daily.mjs

      - name: Commit changes
        run: |
          git config user.name "tenwords-bot"
          git config user.email "actions@github.com"
          git add data/daily
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add daily vocabulary"
          git push

